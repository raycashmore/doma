name: iOS

on:
  push:
    branches: [main]
    paths: ['apps/ios/**', '.github/workflows/ios.yml']
  pull_request:
    branches: [main]
    paths: ['apps/ios/**', '.github/workflows/ios.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test iOS app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The app targets iOS 27, so it needs the newest Xcode on the runner image.
      - name: Select newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Check committed signing settings
        run: apps/ios/scripts/check-project-signing.sh

      # Runs the app-hosted tests. The live contract suite disables itself without a
      # Convex backend and Clerk sign-in ticket; run it locally with scripts/test-live.sh.
      # arm64 only: ConvexMobile's binary framework has no x86_64 simulator slice.
      - name: Build and run tests
        working-directory: apps/ios
        run: |
          xcodebuild test \
            -project Doma.xcodeproj \
            -scheme Doma \
            -destination "$(scripts/simulator-destination.sh)" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

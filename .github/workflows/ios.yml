name: iOS

on:
  push:
    branches: [main]
    paths: ['apps/ios/**', 'packages/tokens/generated/ios/**', '.github/workflows/ios.yml']
  pull_request:
    branches: [main]
    paths: ['apps/ios/**', 'packages/tokens/generated/ios/**', '.github/workflows/ios.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test iOS app
    # A preview image, and the only one with Xcode 27 and an iOS 27 simulator.
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The app targets iOS 27, so it needs the newest Xcode on the runner image.
      - name: Select newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Check committed signing settings
        run: apps/ios/scripts/check-project-signing.sh

      - name: Check screens use the theme
        run: apps/ios/scripts/check-theme.sh

      - name: Check generated tokens are compiled in
        run: apps/ios/scripts/check-generated-tokens.sh

      - name: Check live queries resubscribe
        run: apps/ios/scripts/check-live-queries.sh

      # Runs every suite but the live contract, which needs a Convex backend and a Clerk ticket.
      # Locally, scripts/test-live.sh runs that too.
      # arm64 only: ConvexMobile's binary framework has no x86_64 simulator slice.
      # DOMA_STRICT_WARNINGS fails the build on a Swift warning in the app, widget, tests or DomaKit
      # (see Config/Doma.xcconfig); the environment variable reaches DomaKit's Package.swift.
      # Ad-hoc signed, with no team: an unsigned app has no entitlements, and the simulator's
      # keychain then refuses the device login tests' writes.
      - name: Test
        working-directory: apps/ios
        env:
          DOMA_STRICT_WARNINGS: 'YES'
        run: |
          xcodebuild test \
            -project Doma.xcodeproj \
            -scheme Doma \
            -destination "$(scripts/simulator-destination.sh)" \
            -skip-testing:DomaTests/LiveListsContractTests \
            -resultBundlePath "$RUNNER_TEMP/tests.xcresult" \
            ARCHS=arm64 \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            DOMA_STRICT_WARNINGS=YES \
            -quiet
          scripts/report-test-results.py "$RUNNER_TEMP/tests.xcresult"
